<style>

.btn.line{background:#06C755;border-color:#06C755;color:#fff;font-size:15px;padding:12px 14px}.btn.line:hover{background:#05b34c}.btn.line svg{width:22px;height:22px;fill:#fff}

.tabbar{display:none}

  .pcards{grid-template-columns:1fr}.pcard .b{padding:14px}.pcard img,.pcard .noimg{aspect-ratio:16/10}

  .split{grid-template-columns:1fr 70px 34px}.split .sp_name{grid-column:1/-1}
  .tabbar{scrollbar-width:none}.tabbar::-webkit-scrollbar{display:none}.tabbar button{min-width:70px;min-height:52px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.maplegend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}.maplegend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.mappop img{display:block;width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:6px}.mappop-hl{font-size:12.5px;color:var(--text);margin-top:4px;line-height:1.45}.pubmap{height:220px;border-radius:10px;margin:10px 0;overflow:hidden;border:1px solid var(--line);z-index:0}

<script>
// แสดง error บนหน้าจอ (แทนที่กล่องล็อกอินว่างเปล่า) เพื่อให้แก้ได้ง่าย
window.onerror=function(msg,src,line,col,err){ try{ var b=document.getElementById('authbox'); if(b&&!b.innerHTML.trim()) b.innerHTML='<h1 style="color:#B4372B;font-size:16px">แอปโหลดไม่สำเร็จ</h1><p style="font-size:13px;word-break:break-word">'+String(msg)+' (บรรทัด '+line+')</p><p style="font-size:12px;color:#66736F">ถ่ายภาพหน้านี้ส่งให้ผู้พัฒนา หรือกด F12 → Console</p>'; }catch(e){} };
// ข้อมูลเริ่มต้นจาก doGet: appUrl, lineChannelId, token/pending (หลัง LINE callback), authMsg, state
const BOOT=(function(){ try{ return JSON.parse(document.getElementById('bootjson').textContent||'{}')||{}; }catch(e){ return {}; } })();

//   - การพาทั้งหน้าไปที่อื่น Apps Script ยอมเฉพาะเมื่อผู้ใช้แตะเอง (allow-top-navigation-by-user-activation)

/* ---------- labels ---------- */
const PTYPE={land:'ที่ดิน',house:'บ้าน',condo:'คอนโด',commercial:'อาคารพาณิชย์',other:'อื่นๆ'};
const PSTATUS={pending:['รอตรวจ/รอเอกสาร',''],available:['พร้อมขาย','green'],reserved:['ติดจอง','amber'],consign:['อยู่ในสัญญาขายฝาก','gold'],sold:['ขายแล้ว','ink'],withdrawn:['ถอนประกาศ','']};

const LEAFLET_CSS='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';

// ต้องตรงกับ parseLatLng ใน Code.gs
function parseLatLng(s){
  s=String(s||'');
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/];
  for(const re of pats){ const m=s.match(re); if(m){ const a=+m[1], b=+m[2]; if(Math.abs(a)<=90&&Math.abs(b)<=180) return [a,b]; } }
  return null;
}
function mapsLink(ll){ return 'https://www.google.com/maps?q='+ll[0]+','+ll[1]; }
function navLink(ll){ return 'https://www.google.com/maps/dir/?api=1&destination='+ll[0]+','+ll[1]; }
let LEAFLET=null;
function loadLeaflet(){   // โหลดไลบรารีแผนที่เฉพาะตอนเปิดแผนที่ครั้งแรก หน้าอื่นไม่ต้องรอ
  if(LEAFLET) return LEAFLET;
  LEAFLET=new Promise((res,rej)=>{
    const css=document.createElement('link'); css.rel='stylesheet'; css.href=LEAFLET_CSS; document.head.appendChild(css);
    const s=document.createElement('script'); s.src=LEAFLET_JS;
    s.onload=()=>res(window.L);
    s.onerror=()=>{ LEAFLET=null; rej(new Error('โหลดแผนที่ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่')); };
    document.head.appendChild(s);
  });
  return LEAFLET;
}
function pinIcon(color){
  return window.L.divIcon({className:'pm-pin',html:'<span style="background:'+color+'"></span>',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26]});
}
function mapPopup(p,ll){
  const st=PSTATUS[p.status]||[p.status,''];
  const img=cover(p.id), size=[areaText(p),p.type!=='condo'&&Number(p.size_sqm)?p.size_sqm+' ตร.ม.':'',Number(p.bedrooms)?p.bedrooms+' ห้องนอน':''].filter(Boolean).join(' · ');
  const hl=String(p.highlight||'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
  return '<div class="mappop">'+(img?'<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<b>'+esc(p.name)+'</b>'+
    '<div class="mappop-price">'+(Number(p.price)?fmtN(p.price)+' ฿':'สอบถามราคา')+' <span class="tag '+st[1]+'">'+esc(st[0])+'</span></div>'+
    '<div class="mappop-meta">'+esc([PTYPE[p.type],PDEAL[p.deal]].filter(Boolean).join(' · '))+'</div>'+
    (size?'<div class="mappop-meta">ขนาด '+esc(size)+'</div>':'')+
    '<div class="mappop-meta">'+esc([p.district,p.province].filter(Boolean).join(' '))+'</div>'+
    (hl?'<div class="mappop-hl">'+esc(hl.length>90?hl.slice(0,89)+'…':hl)+'</div>':'')+
    '<div class="mappop-btn"><button class="btn sm" onclick="editProp(\''+p.id+'\')">'+(isAgent()?'แก้ไขทรัพย์':'ดูรายละเอียด')+'</button>'+
    '<a class="btn sm primary" target="_blank" href="'+esc(navLink(ll))+'">นำทาง</a></div></div>';
}
let MAPI=null;
async function vMap(){
  const pts=D.Properties.map(p=>({p,ll:parseLatLng(p.location)}));
  const pinned=pts.filter(x=>x.ll), missing=pts.length-pinned.length;
  head('แผนที่ทรัพย์',pinned.length+' รายการปักหมุดแล้ว'+(missing?' · '+missing+' รายการยังไม่มีหมุด':''),'');
  const legend=Object.keys(PIN_COLOR).filter(k=>pts.some(x=>x.p.status===k)).map(k=>'<span><i style="background:'+PIN_COLOR[k]+'"></i>'+esc((PSTATUS[k]||[k])[0])+'</span>').join('');
  const tip=missing&&isAgent()?'<p class="maphint">ทรัพย์ที่ยังไม่มีหมุด: เปิดทรัพย์นั้น แล้วกด "ปักหมุดบนแผนที่" หรือวางลิงก์ Google Maps ลงในช่องลิงก์แผนที่</p>':'';
  V().innerHTML='<div class="maplegend">'+legend+'</div><div id="mapbox" class="mapwrap"></div>'+tip;
  let L;
  try{ L=await loadLeaflet(); }
  catch(e){ const b=document.getElementById('mapbox'); if(b) b.innerHTML='<div class="empty"><b>โหลดแผนที่ไม่สำเร็จ</b>'+esc(e.message)+'</div>'; return; }
  const box=document.getElementById('mapbox'); if(!box) return;   // ผู้ใช้เปลี่ยนหน้าไประหว่างโหลด
  if(MAPI){ try{ MAPI.remove(); }catch(e){} }
  const m=L.map(box,{zoomControl:false}); MAPI=m;
  L.control.zoom({position:'bottomright'}).addTo(m);
  L.tileLayer(OSM_TILES,{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
  const bounds=[];
  pinned.forEach(({p,ll})=>{ L.marker(ll,{icon:pinIcon(PIN_COLOR[p.status]||'#8A9591')}).addTo(m).bindPopup(mapPopup(p,ll),{autoPanPadding:[24,24]}); bounds.push(ll); });
  if(bounds.length) m.fitBounds(bounds,{padding:[36,36],maxZoom:15}); else m.setView([15.5,101],6);
  setTimeout(()=>m.invalidateSize(),80);
}
// ช่อง "ลิงก์แผนที่ / พิกัด" ในฟอร์มทรัพย์: ปุ่มเปิดตัวปักหมุดเต็มจอ

// ค้นหาตำแหน่งจากชื่อด้วย OpenStreetMap (ฟรี ไม่ต้องมีคีย์ ใช้เบาๆ ได้) ชื่ออำเภอ/จังหวัดแม่น ชื่อหมู่บ้านอิสระอาจพลาด
const NOMINATIM='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=th&accept-language=th&limit=1&q=';
async function geoFind(q){
  try{ const r=await (await fetch(NOMINATIM+encodeURIComponent(q))).json();
    if(r&&r[0]) return {ll:[+r[0].lat,+r[0].lon],name:r[0].display_name||q,type:r[0].addresstype||''}; }catch(e){}
  return null;
}
function areaQuery(frm){   // "อำเภอเมืองลำปาง จังหวัดลำปาง" — รูปแบบนี้ค้นเจอแม่นที่สุด
  const prov=String((frm.elements.province||{}).value||'').trim().replace(/^(จ\.|จังหวัด)\s*/,'');
  const dist=String((frm.elements.district||{}).value||'').trim().replace(/^(อ\.|อำเภอ|เขต)\s*/,'');
  const bkk=/กรุงเทพ/.test(prov);
  return {prov,dist,
    district:dist?((bkk?'เขต':'อำเภอ')+(dist==='เมือง'&&prov?'เมือง'+prov:dist)+(prov?(bkk?' ':' จังหวัด')+prov:'')):'',
    province:prov?(bkk?prov:'จังหวัด'+prov):''};
}
let PINMAP=null;
function closePinPicker(){ if(PINMAP){ try{PINMAP.remove();}catch(e){} PINMAP=null; } const w=document.getElementById('pinpick'); if(w) w.remove(); }
async function openPinPicker(inp,frm){
  closePinPicker();
  const w=document.createElement('div'); w.id='pinpick'; w.className='pinpick';
  w.innerHTML='<div class="pp-top"><input id="pp_q" type="search" placeholder="ค้นหา อำเภอ ตำบล หรือสถานที่ใกล้แปลง" enterkeyhint="search"><button type="button" class="btn sm" id="pp_go">ค้นหา</button><button type="button" class="btn sm" id="pp_x">ปิด</button></div>'+
    '<div class="pp-mapwrap"><div id="pp_map"></div><div class="pp-cross"><span></span></div><div class="pp-dot"></div><div class="pp-msg" id="pp_msg"></div></div>'+
    '<div class="pp-bot"><div class="pp-ll" id="pp_ll">เลื่อนแผนที่ให้หมุดกลางจออยู่บนแปลง แล้วกดใช้ตำแหน่งนี้</div>'+
    // GPS ใช้ได้เฉพาะใน MINI App (หน้าเว็บ Apps Script อยู่ในกรอบที่เบราว์เซอร์ไม่ให้สิทธิ์ตำแหน่ง)
    (BOOT.mini&&navigator.geolocation?'<button type="button" class="btn" id="pp_gps" style="margin-bottom:8px">◎ ไปที่ตำแหน่งปัจจุบันของฉัน</button>':'')+
    '<button type="button" class="btn primary" id="pp_ok">ใช้ตำแหน่งนี้</button>'+
    '<p class="pp-tip">อีกวิธี: เปิดแอป Google Maps กดค้างที่แปลงให้ขึ้นหมุด แล้วกด แชร์ → คัดลอกลิงก์ มาวางในช่องลิงก์แผนที่</p></div>';
  document.body.appendChild(w);
  const msg=t=>{ const e=document.getElementById('pp_msg'); if(e){ e.textContent=t||''; e.hidden=!t; } };
  document.getElementById('pp_x').onclick=closePinPicker;
  let L; try{ L=await loadLeaflet(); }catch(e){ msg(e.message); return; }
  if(!document.getElementById('pp_map')) return;   // ปิดไปก่อนโหลดเสร็จ
  const ll=parseLatLng(inp.value);
  const m=L.map('pp_map',{zoomControl:false}).setView(ll||[15.5,101],ll?17:6); PINMAP=m;
  L.control.zoom({position:'bottomright'}).addTo(m);
  L.tileLayer(OSM_TILES,{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
  const out=document.getElementById('pp_ll');
  const upd=()=>{ const c=m.getCenter(); out.textContent='พิกัด '+c.lat.toFixed(5)+', '+c.lng.toFixed(5)+(m.getZoom()<14?' · ซูมเข้าอีกหน่อยให้เห็นแปลงชัด':''); };
  m.on('move',upd);
  setTimeout(()=>m.invalidateSize(),60);
  const gps=document.getElementById('pp_gps');
  if(gps) gps.onclick=()=>{ msg('กำลังหาตำแหน่ง…');
    navigator.geolocation.getCurrentPosition(g=>{ if(PINMAP!==m) return; m.setView([g.coords.latitude,g.coords.longitude],18); msg('อยู่ที่ตำแหน่งปัจจุบันแล้ว (คลาดเคลื่อนราว '+Math.round(g.coords.accuracy)+' ม.) เลื่อนปรับได้'); setTimeout(()=>msg(''),5000); },
      ()=>msg('อ่านตำแหน่งไม่ได้ เปิด GPS และอนุญาตให้ LINE ใช้ตำแหน่ง แล้วลองใหม่'),{enableHighAccuracy:true,timeout:15000}); };
  const q=areaQuery(frm);
  const go=async(text,zoom)=>{ const hit=await geoFind(text); if(hit&&PINMAP===m){ m.setView(hit.ll,zoom); msg('ไปที่: '+hit.name); setTimeout(()=>msg(''),4000); } return hit; };
  if(!ll){
    msg(q.district||q.province?'กำลังพาไปที่ '+(q.dist||q.prov)+'…':'ซูมเข้าไปที่ตั้งแปลง แล้วเลื่อนให้หมุดกลางจออยู่บนแปลง');
    const hit=(q.district&&await go(q.district,14))||(q.province&&await go(q.province,10));
    if(!hit&&(q.district||q.province)) msg('หาตำแหน่ง '+(q.dist||q.prov)+' ไม่เจอ ลองพิมพ์ค้นหาด้านบน หรือซูมเอง');
  }
  upd();
  const search=async()=>{ const t=document.getElementById('pp_q').value.trim(); if(!t) return;
    msg('กำลังค้นหา…'); const hit=await go(t+(q.prov&&t.indexOf(q.prov)<0?' '+q.prov:''),16); if(!hit) msg('ไม่พบ "'+t+'" ลองชื่ออำเภอหรือตำบล'); };
  document.getElementById('pp_go').onclick=search;
  document.getElementById('pp_q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); search(); } });
  document.getElementById('pp_ok').onclick=()=>{
    if(m.getZoom()<13){ msg('ซูมเข้าให้เห็นแปลงก่อน (ตอนนี้ยังไกลเกินไป)'); return; }
    const c=m.getCenter(); inp.value=mapsLink([+c.lat.toFixed(6),+c.lng.toFixed(6)]);
    inp.dispatchEvent(new Event('input'));
    closePinPicker(); toast('ปักหมุดแล้ว กดบันทึกเพื่อเก็บตำแหน่ง');

// คำสั่งที่เขียนข้อมูล — ห้ามส่งซ้อนกัน กันกดซ้ำแล้วได้รายการซ้ำ (เซิร์ฟเวอร์สร้าง id ใหม่ทุกครั้งที่ยังไม่มี id)
const MUTATING=['save','delete','setUser','changePin','uploadFile','postDealIncome','requestContact','completeProfile','register','login','logout','submitLead'];
let INFLIGHT=false;
function call(action,payload){
  const lock=MUTATING.includes(action);
  if(lock&&INFLIGHT) return Promise.reject(new Error('กำลังบันทึกรายการก่อนหน้าอยู่ กรุณารอสักครู่'));
  if(lock) INFLIGHT=true;
  const done=()=>{ busy(false); if(lock) INFLIGHT=false; };
  busy(true);
  if(BOOT.mini){   // LINE MINI App: หน้าจออยู่นอก Apps Script เรียก API ผ่าน doPost (text/plain = ไม่ต้อง preflight)
    return fetch(BOOT.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({mini:1,token:TOKEN,action:action,p:payload||{}})})
      .then(r=>r.json()).then(r=>{ done(); if(r&&r.ok) return r.data; throw new Error(r?r.error:'ไม่ได้รับคำตอบ'); },
        e=>{ done(); throw new Error('เชื่อมต่อระบบไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); });
  }
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(r=>{done(); if(r&&r.ok) res(r.data); else rej(new Error(r?r.error:'ไม่ได้รับคำตอบ'));})
      .withFailureHandler(e=>{done();rej(e);}).api(TOKEN,action,payload||{});
  });
}
// ใช้กับปุ่มทุกปุ่มที่เขียนข้อมูล: onclick="act(this,()=>ฟังก์ชัน(),'กำลัง…')"
// ล็อกปุ่ม เปลี่ยนข้อความบอกสถานะ แล้วคืนค่าเดิมเมื่อเสร็จ
async function act(el,fn,label){
  const b=(el&&el.tagName==='BUTTON')?el:null;
  if(b&&b.disabled) return;
  if(b){ b.dataset.lbl=b.innerHTML; b.disabled=true; b.innerHTML=label||'กำลังทำงาน…'; }
  try{ return await fn(); }
  catch(e){ toast(e.message||String(e)); }
  finally{ if(b&&b.isConnected){ b.disabled=false; b.innerHTML=b.dataset.lbl; } }
}
function busy(on){document.getElementById('busy').classList.toggle('on',on);}
async function reload(){ D=await call('bootstrap'); ME=D.me; render(); }
async function saveRow(table,row,msg){ try{ const saved=await call('save',{table,row}); closeModal(); await reload(); toast(msg||'บันทึกแล้ว'); return saved; }catch(e){ toast(e.message); } }
async function delRow(table,id,msg){ if(!confirm('ยืนยันลบรายการนี้?')) return; try{ await call('delete',{table,id}); closeModal(); await reload(); toast(msg||'ลบแล้ว'); }catch(e){ toast(e.message); } }

const IMG_MAX_PX=1600, IMG_QUALITY=0.82, IMG_PASS_BYTES=900*1024;
// ย่อรูปในเบราว์เซอร์ก่อนส่ง — รูปจากมือถือรุ่นใหม่มักเกิน 8MB ถ้าไม่ย่อจะอัปไม่ได้เลย
// คืน null = ไม่ต้องย่อ (ไม่ใช่รูป หรือเล็กอยู่แล้ว) ให้ผู้เรียกส่งไฟล์ต้นฉบับไป
function shrinkImage(file){
  return new Promise(res=>{
    if(!/^image\/(jpeg|png|webp)$/i.test(file.type)) return res(null);
    if(file.size<=IMG_PASS_BYTES) return res(null);
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      try{
        const sc=Math.min(1,IMG_MAX_PX/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const data=cv.toDataURL('image/jpeg',IMG_QUALITY).split(',')[1];
        res(data&&data.length?{base64:data,mime:'image/jpeg',w:w,h:h}:null);
      }catch(e){ res(null); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
async function uploadFiles(inp,propertyId){
  const files=[...inp.files]; if(!files.length) return;
  if(inp.disabled) return;
  inp.disabled=true;   // กันกดซ้ำระหว่างอัปโหลด (ปลดล็อกเองตอน editProp สร้างฟอร์มใหม่)
  let n=0, shrunk=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    toast(`กำลังเตรียม ${i+1}/${files.length} · ${f.name}`);
    const small=await shrinkImage(f);
    if(!small&&f.size>8*1024*1024){ toast(f.name+' ใหญ่เกิน 8MB และย่อไม่ได้ (ไฟล์ไม่ใช่รูป)'); continue; }
    let name=f.name, mime=f.type||'application/octet-stream', b64;
    if(small){
      b64=small.base64; mime='image/jpeg'; shrunk++;
      name=f.name.replace(/\.[^.]+$/,'')+'.jpg';
    }else{
      b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f);});
    }
    toast(`กำลังอัปโหลด ${i+1}/${files.length} · ${name}`);
    try{ await call('uploadFile',{propertyId,name,mime,base64:b64}); n++; }catch(e){ toast(e.message); }
  }
  if(n) toast(`อัปโหลด ${n} ไฟล์เรียบร้อย`+(shrunk?` (ย่อรูปให้ ${shrunk} ไฟล์)`:''));
  await reload(); editProp(propertyId);
}

function editDeal(id,propId){
  const d=id?byId(D.Deals,id):{property:propId||'',status:'negotiating',commissionPct:3,closeDate:today(),splits:[{user:ME.id,name:'',pct:100}]};
  const p=byId(D.Properties,d.property); if(!id&&p){ d.price=p.price; const l=D.Listings.find(x=>x.property===p.id&&x.status==='active'); if(l) d.commissionPct=l.commissionPct; }
  const fields=[{k:'property',l:'ทรัพย์',t:'select',o:opts(isBroker()?D.Properties.filter(x=>x.brokerUser===ME.id):D.Properties),full:1},{k:'buyerUser',l:'ผู้ซื้อ',t:'select',o:opts(usersBy('buyer','owner'))},{k:'status',l:'สถานะ',t:'select',o:selMap(DSTATUS)},{k:'price',l:'ราคาซื้อขายจริง (฿)',t:'number'},{k:'commissionPct',l:'ค่าคอมรวม (%)',t:'number'},{k:'closeDate',l:'วันโอน/ปิดดีล',t:'date'},{k:'note',l:'บันทึก',t:'textarea',full:1}];
  const splitRow=(s={})=>`<div class="split"><select class="sp_user"><option value="">— Co-agent ภายนอก —</option>${staffUsers().map(u=>`<option value="${u.id}" ${s.user===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><input class="sp_name" placeholder="ชื่อ (ถ้าเป็นคนนอก)" value="${esc(s.name||'')}"><input class="sp_pct" type="number" inputmode="decimal" placeholder="%" value="${s.pct??''}"><button type="button" class="btn sm" onclick="this.parentNode.remove();updSplit()">×</button></div>`;
  const linked=`<div class="linked"><h4>แบ่งค่าคอมมิชชั่น (รวมต้องได้ 100%)</h4><div id="splits">${(d.splits||[]).map(splitRow).join('')}</div><button type="button" class="btn sm" onclick="document.getElementById('splits').insertAdjacentHTML('beforeend',SPLITROW);updSplit()">+ เพิ่มผู้ร่วม / Co-agent</button><div id="splitsum" style="margin-top:8px;font-size:14px"></div>
    ${id&&d.status==='closed'&&!d.posted&&isStaff()?`<div style="margin-top:10px"><button type="button" class="btn sm primary" onclick="act(this,()=>postDeal('${id}'),'กำลังลงบัญชี…')">ลงบัญชีค่าคอมเป็นรายรับ</button></div>`:''}</div>`;
  window.SPLITROW=splitRow();
  const readSplits=()=>[...document.querySelectorAll('#splits .split')].map(r=>({user:r.querySelector('.sp_user').value,name:r.querySelector('.sp_name').value.trim(),pct:Number(r.querySelector('.sp_pct').value)||0}));
  window.updSplit=()=>{ const E=document.getElementById('frm').elements; const amt=Number(E.price.value)*Number(E.commissionPct.value)/100; const sp=readSplits(); const sum=sp.reduce((s,x)=>s+x.pct,0); document.getElementById('splitsum').innerHTML=`ค่าคอมรวม <b>${fmtN(amt)} ฿</b> · ${sp.map(x=>`${esc(x.name||uName(x.user))} ${fmtN(amt*x.pct/100)}`).join(' / ')} · <b style="color:${Math.abs(sum-100)<0.01?'var(--green)':'var(--red)'}">รวม ${sum}%</b>`; };
  openForm(id?'ดีล':'เปิดดีล',fields,d,linked,dd=>{ if(!dd.property) return toast('เลือกทรัพย์'); return saveRow('Deals',Object.assign({},d,dd,{splits:readSplits()})); },id&&isStaff()?()=>delRow('Deals',id):null,()=>{updSplit();return '';});
  document.getElementById('splits').addEventListener('input',updSplit); updSplit();
}

function rowUser(u,admin){ return `<div class="row" onclick="editUser('${u.id}')"><div><div class="t">${esc(u.name)}</div><div class="s">${ROLE[u.role]||''}${u.masked?' · <span class="tag gold">ติดต่อผ่านทีมงาน</span>':` · ${esc(u.phone||'')}${u.line?' · LINE '+esc(u.line):''}${u.email?' · '+esc(u.email):''}`}</div></div><div class="right"><div class="s">${u.masked?'':tag(USTATUS,u.status)}</div>${admin&&canManage(u)&&u.status==='pending'?`<div class="s" style="margin-top:4px"><button class="btn sm primary" onclick="event.stopPropagation();approveUser('${u.id}')">อนุมัติ</button></div>`:''}</div></div>`; }
function vCust(){
  head('ลูกค้า',isBroker()?'ผู้ติดต่อที่คุณเพิ่มเอง · ลูกค้าจากระบบจะแสดงเป็นรหัสและติดต่อผ่านทีมงาน':`เจ้าของทรัพย์และผู้ซื้อ ${usersBy('owner','buyer').length} ราย`,`<button class="btn primary" onclick="editUser()">+ เพิ่มผู้ติดต่อ</button>`);
  const list=usersBy('owner','buyer').filter(u=>match(u.name+u.phone+u.line+u.email+u.note)&&(!filter.a||u.role===filter.a));
  V().innerHTML=toolbar('ค้นหาชื่อ เบอร์ อีเมล…',{label:'ทุกประเภท',map:{owner:ROLE.owner,buyer:ROLE.buyer}})+`<div class="card"><div class="rows">${list.map(u=>rowUser(u,false)).join('')||empty('ไม่พบลูกค้า','')}</div></div>`;
}
function vUsers(){
  head('ผู้ใช้และสิทธิ์',`รออนุมัติ ${D.Users.filter(u=>u.status==='pending').length} · ทั้งหมด ${D.Users.length}`,`<button class="btn primary" onclick="editUser()">+ เพิ่มผู้ใช้</button>`);
  const list=D.Users.filter(u=>match(u.name+u.email+u.phone)&&(!filter.a||u.role===filter.a)&&(!filter.b||u.status===filter.b)).sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
  V().innerHTML=toolbar('ค้นหา…',{label:'ทุกบทบาท',map:ROLE},{label:'ทุกสถานะ',map:USTATUS})+`<div class="card"><div class="rows">${list.map(u=>rowUser(u,true)).join('')}</div></div>`;
}
async function setUser(id,p){ try{ await call('setUser',Object.assign({id},p)); await reload(); toast('อัปเดตผู้ใช้แล้ว'); }catch(e){ toast(e.message); } }
// อนุมัติ + กำหนดบทบาทในขั้นตอนเดียว กันลืมว่าผู้สมัครเลือกบทบาทเองมา
function approveUser(id){
  const u=byId(D.Users,id); if(!u) return;
  if(!canManage(u)) return toast('บัญชีทีมงาน/ผู้ดูแลระบบ ต้องให้ผู้ดูแลระบบเป็นคนจัดการ');
  const roles=ME.role==='admin'?ROLE:STAFF_ROLES;
  const contact=[u.phone,u.email,u.line?'LINE '+u.line:''].filter(Boolean).map(esc).join(' · ')||'ไม่ได้กรอกข้อมูลติดต่อ';
  openView('อนุมัติผู้ใช้',`<p><b>${esc(u.name)}</b></p><p style="color:var(--muted);font-size:13.5px">${contact}</p>
    <p style="font-size:13.5px;margin-top:10px">ผู้สมัคร <b>เลือกเอง</b> ว่าเป็น <b>${ROLE[u.role]||'-'}</b> — ยืนยันหรือเปลี่ยนบทบาทก่อนอนุมัติ</p>
    <div class="f" style="margin:12px 0"><label>ให้สิทธิ์เป็น</label><select id="ap_role">${Object.entries(roles).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <p style="color:var(--muted);font-size:12.5px">นายหน้าภายนอก = เห็นเฉพาะทรัพย์ที่ตนนำมาลง ลูกค้าจากระบบจะถูกซ่อนเบอร์และอีเมล${ME.role==='admin'?' · ทีมงาน = เห็นทุกทรัพย์ ทุกสัญญา และข้อมูลติดต่อลูกค้าทั้งหมด':' · ถ้าต้องการตั้งเป็นทีมงานหรือผู้ดูแลระบบ ต้องให้ผู้ดูแลระบบเป็นคนตั้ง'}</p>
    <div class="mact"><button type="button" class="btn danger" onclick="act(this,()=>setUser('${id}',{status:'blocked'}).then(closeModal),'กำลังระงับ…')">ปฏิเสธ (ระงับบัญชี)</button><span style="display:flex;gap:8px"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="button" class="btn primary" onclick="act(this,()=>setUser('${id}',{status:'active',role:document.getElementById('ap_role').value}).then(closeModal),'กำลังอนุมัติ…')">อนุมัติ</button></span></div>`);
}
function editUser(id){
  const u=id?byId(D.Users,id):{role:'owner',status:'contact'}, admin=ME.role==='admin', mng=id?canManage(u):isStaff();
  if(u.masked) return openView(esc(u.name),`<p>${ROLE[u.role]||''} · ข้อมูลติดต่ออยู่กับทีมงาน</p><p style="color:var(--muted);font-size:13.5px;margin:6px 0 12px">ส่งคำขอแล้วทีมงานจะติดต่อลูกค้าและประสานกลับให้คุณ</p><button class="btn primary" onclick="act(this,()=>{closeModal();return askContact('${u.id}','');},'กำลังส่งคำขอ…')">ขอให้ทีมงานติดต่อ</button>`);
  const fields=[{k:'name',l:'ชื่อ-นามสกุล',full:1},{k:'email',l:'อีเมล (ใช้ล็อกอิน)',t:'email'},{k:'phone',l:'โทรศัพท์',t:'tel'},{k:'line',l:'LINE ID'},
    {k:'role',l:'บทบาท',t:'select',o:admin?ROLE:(isStaff()?STAFF_ROLES:{owner:ROLE.owner,buyer:ROLE.buyer}),dis:!admin&&!!id&&!mng},...(admin||mng?[{k:'status',l:'สถานะบัญชี',t:'select',o:selMap(USTATUS)}]:[]),{k:'note',l:'บันทึก / ความต้องการ',t:'textarea',full:1}];
  let linked='';
  if(id){ const ps=D.Properties.filter(p=>p.ownerUser===id), vs=D.Viewings.filter(v=>v.buyerUser===id), ns=D.Needs.filter(n=>n.buyerUser===id);
    linked=`<div class="linked"><h4>ทรัพย์ ${ps.length} · นัดชม ${vs.length} · ความต้องการ ${ns.length}</h4>${ps.map(p=>`<div class="li"><span>${esc(p.name)}</span>${tag(PSTATUS,p.status)}</div>`).join('')}${ns.map(n=>`<div class="li"><span>${esc(needText(n))}</span><button type="button" class="btn sm" onclick="closeModal();go('match');showMatches('${n.id}')">จับคู่</button></div>`).join('')}
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${u.phone?`<a class="btn sm" href="tel:${esc(u.phone)}">โทร</a>`:''}<button type="button" class="btn sm" onclick="closeModal();editViewing(null,'','${id}')">+ นัดชม</button><button type="button" class="btn sm" onclick="closeModal();editTask(null,'','${id}')">+ งาน</button>
    ${mng&&u.status!=='contact'?`<button type="button" class="btn sm" onclick="act(this,()=>resetPin('${id}'),'กำลังรีเซ็ต…')">รีเซ็ต PIN</button>`:''}${mng&&u.status==='pending'?`<button type="button" class="btn sm primary" onclick="closeModal();approveUser('${id}')">อนุมัติบัญชี</button>`:''}</div></div>`; }
  openForm(id?'ข้อมูลผู้ใช้':'เพิ่มผู้ติดต่อ',fields,u,linked,d=>{ if(!d.name) return toast('ใส่ชื่อ'); return saveRow('Users',Object.assign({},u,d)); },id&&admin?()=>delRow('Users',id):null);
}
async function askContact(userId,propertyId){ const m=prompt('ข้อความถึงทีมงาน (เช่น ต้องการนัดชม/เสนอราคา)')||''; try{ await call('requestContact',{userId,propertyId,message:m}); toast('ส่งคำขอถึงทีมงานแล้ว'); }catch(e){ toast(e.message); } }
async function resetPin(id){ const pin=prompt('PIN ใหม่ (ตัวเลข 4–8 หลัก)'); if(!pin) return; await setUser(id,{pin}); }

/* ---------- tasks ---------- */
function rowTask(t){ const late=!t.done&&t.date<today(); return `<div class="row" onclick="editTask('${t.id}')"><div><div class="t" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div><div class="s">${TTYPE[t.type]||''}${t.property?' · '+esc(pName(t.property)):''}${t.person?' · '+esc(uName(t.person)):''} · ${esc(uName(t.assignee))}</div></div><div class="right" style="color:${late?'var(--red)':'inherit'}">${fmtD(t.date)}<div class="s">${t.time||''} <button class="btn sm" onclick="event.stopPropagation();act(this,()=>toggleTask('${t.id}'),'…')">${t.done?'ยังไม่เสร็จ':'เสร็จแล้ว'}</button></div></div></div>`; }
function vTask(){
  head('งานและนัดหมาย',`${D.Tasks.filter(t=>!t.done).length} งานที่ยังไม่เสร็จ`,`<button class="btn primary" onclick="editTask()">+ เพิ่มงาน</button>`);
  const list=D.Tasks.filter(t=>match(t.title+pName(t.property))&&(!filter.a||t.type===filter.a)&&(filter.b==='mine'?t.assignee===ME.id:filter.b==='done'?t.done:filter.b==='open'?!t.done:true)).sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date));
  V().innerHTML=toolbar('ค้นหางาน…',{label:'ทุกประเภท',map:TTYPE},{label:'ทั้งหมด',map:{mine:'ของฉัน',open:'ยังไม่เสร็จ',done:'เสร็จแล้ว'}})+`<div class="card"><div class="rows">${list.map(rowTask).join('')||empty('ไม่มีงาน','')}</div></div>`;
}
function toggleTask(id){ const t=byId(D.Tasks,id); return saveRow('Tasks',Object.assign({},t,{done:!t.done}),t.done?'เปิดงานใหม่':'ทำเสร็จแล้ว'); }
function editTask(id,propId,personId){
  const t=id?byId(D.Tasks,id):{type:'viewing',date:today(),property:propId||'',person:personId||'',assignee:ME.id,done:false};
  const fields=[{k:'title',l:'ชื่องาน',full:1},{k:'type',l:'ประเภท',t:'select',o:TTYPE},{k:'assignee',l:'ผู้รับผิดชอบ',t:'select',o:opts(staffUsers()),dis:isBroker()},{k:'date',l:'วันที่',t:'date'},{k:'time',l:'เวลา',t:'time'},{k:'property',l:'ทรัพย์',t:'select',o:opts(D.Properties)},{k:'person',l:'ลูกค้า',t:'select',o:opts(D.Users)},{k:'done',l:'สถานะ',t:'select',o:{false:'ยังไม่เสร็จ',true:'เสร็จแล้ว'}},{k:'note',l:'รายละเอียด',t:'textarea',full:1}];
  openForm(id?'แก้ไขงาน':'เพิ่มงาน',fields,Object.assign({},t,{done:String(t.done)}),'',d=>{ if(!d.title) return toast('ใส่ชื่องาน'); d.done=d.done==='true'; return saveRow('Tasks',Object.assign({},t,d)); },id?()=>delRow('Tasks',id):null);
}

/* ---------- finance ---------- */
function vFin(){
  const ym=today().slice(0,7);
  const list=D.Transactions.filter(t=>match(t.note+pName(t.property)+(TRCAT[t.cat]||''))&&(!filter.a||t.cat===filter.a)&&(!filter.b||t.type===filter.b)).sort((a,b)=>b.date.localeCompare(a.date));
  const sum=(arr,f)=>arr.filter(f).reduce((s,t)=>s+Number(t.amount),0);
  head('การเงิน',isBroker()?'ค่าคอมที่ทีมงานลงบัญชีให้คุณ':`รายรับเดือนนี้ ${fmtN(sum(D.Transactions,t=>t.type==='income'&&t.date.startsWith(ym)))} ฿`,isStaff()?`<button class="btn primary" onclick="editTr()">+ บันทึกรายการ</button>`:'');
  V().innerHTML=`<div class="stats"><div class="stat"><div class="l">ค่าคอมมิชชั่นสะสม</div><div class="v">${fmtN(sum(D.Transactions,t=>t.cat==='commission'))} <small>฿</small></div></div><div class="stat"><div class="l">ผลตอบแทนขายฝากสะสม</div><div class="v">${fmtN(sum(D.Transactions,t=>t.cat==='interest'))} <small>฿</small></div></div><div class="stat"><div class="l">รายรับ (ตามตัวกรอง)</div><div class="v income">${fmtN(sum(list,t=>t.type==='income'))}</div></div><div class="stat"><div class="l">รายจ่าย (ตามตัวกรอง)</div><div class="v expense">${fmtN(sum(list,t=>t.type==='expense'))}</div></div></div>`
  + toolbar('ค้นหา…',{label:'ทุกหมวด',map:TRCAT},{label:'รับ/จ่าย',map:{income:'รายรับ',expense:'รายจ่าย'}})
  + `<div class="card" style="overflow:auto"><table><thead><tr><th>วันที่</th><th>หมวด</th><th>ทรัพย์ / บันทึก</th><th>ของ</th><th class="num">จำนวน (฿)</th></tr></thead><tbody>${list.map(t=>`<tr class="click" onclick="editTr('${t.id}')"><td>${fmtD(t.date)}</td><td>${TRCAT[t.cat]||''}</td><td>${t.property?esc(pName(t.property)):''}${t.note?`<div style="color:var(--muted);font-size:13px">${esc(t.note)}</div>`:''}</td><td>${esc(uName(t.user))}</td><td class="num ${t.type}">${t.type==='income'?'+':'-'}${fmtN(t.amount)}</td></tr>`).join('')||`<tr><td colspan="5">${empty('ยังไม่มีรายการ','')}</td></tr>`}</tbody></table></div>`;
}
function editTr(id,propId,contId){
  if(!isStaff()) return;
  const t=id?byId(D.Transactions,id):{date:today(),type:'income',cat:contId?'interest':'commission',property:propId||'',contract:contId||'',user:ME.id};
  const fields=[{k:'type',l:'ประเภท',t:'select',o:{income:'รายรับ',expense:'รายจ่าย'}},{k:'cat',l:'หมวด',t:'select',o:TRCAT},{k:'amount',l:'จำนวน (฿)',t:'number'},{k:'date',l:'วันที่',t:'date'},{k:'property',l:'ทรัพย์',t:'select',o:opts(D.Properties)},{k:'contract',l:'สัญญาขายฝาก',t:'select',o:Object.fromEntries(D.Contracts.map(c=>[c.id,`${pName(c.property)} · ${fmtN(c.amount)}`]))},{k:'user',l:'ของ (นายหน้า)',t:'select',o:opts(staffUsers())},{k:'note',l:'บันทึก',t:'textarea',full:1}];
  openForm(id?'แก้ไขรายการ':'บันทึกรายรับ-รายจ่าย',fields,t,'',d=>{ if(!Number(d.amount)) return toast('ใส่จำนวนเงิน'); return saveRow('Transactions',Object.assign({},t,d)); },id?()=>delRow('Transactions',id):null);
}

/* ---------- ลิงก์รับลีด + QR สำหรับติดป้าย/ใบปลิว ---------- */
function leadLinkCard(){
  return `<div class="card" style="padding:16px;margin-top:14px"><h3 style="padding:0">ลิงก์รับลีด + QR code</h3>
    <p class="sub" style="padding:0;margin-bottom:10px">ติดป้ายหน้าทรัพย์ ใบปลิว หรือนามบัตร ลูกค้าสแกนแล้วกรอกชื่อ-เบอร์ ระบบจะสร้างงานโทรกลับให้ทันที</p>
    <div class="form" style="grid-template-columns:1fr 1fr">
      <div class="f"><label>แหล่งที่มา (ใช้แยกว่าลีดมาจากไหน)</label><input id="lk_src" value="ป้ายหน้าทรัพย์" oninput="leadLink()"></div>
      <div class="f"><label>เจาะจงทรัพย์ (ไม่บังคับ)</label><select id="lk_prop" onchange="leadLink()"><option value="">- ฟอร์มทั่วไป -</option>${D.Properties.filter(p=>['available','reserved'].includes(p.status)).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="f full"><label>ลิงก์</label><input id="lk_url" readonly onclick="this.select()"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start">
      <button class="btn" onclick="leadCopy(this)">คัดลอกลิงก์</button>
      <a class="btn" id="lk_open" target="_blank" href="#">เปิดดูฟอร์ม</a>
      <img id="lk_qr" alt="QR" width="150" height="150" style="border:1px solid var(--line);border-radius:8px;background:#fff" onerror="this.style.display='none';document.getElementById('lk_qrnote').hidden=false">
      <span id="lk_qrnote" hidden style="font-size:12.5px;color:var(--muted);max-width:220px">แสดง QR บนหน้าจอไม่ได้ ใช้ไฟล์โปสเตอร์ในโฟลเดอร์ qr/ สำหรับพิมพ์แทน</span>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:10px">QR บนหน้าจอนี้สร้างโดยบริการภายนอก (api.qrserver.com) ไว้ดูเร็วๆ เท่านั้น · สำหรับพิมพ์จริงใช้ไฟล์ความละเอียดสูงที่สร้างจากสคริปต์ make-qr.ps1</p></div>`;
}
function leadUrl(){
  const src=document.getElementById('lk_src').value.trim(), pid=document.getElementById('lk_prop').value;
  return BOOT.appUrl+'?form=lead'+(src?'&src='+encodeURIComponent(src):'')+(pid?'&p='+encodeURIComponent(pid):'');
}
function leadLink(){
  const u=leadUrl();
  document.getElementById('lk_url').value=u;
  document.getElementById('lk_open').href=u;
  const q=document.getElementById('lk_qr');
  q.style.display=''; document.getElementById('lk_qrnote').hidden=true;
  q.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data='+encodeURIComponent(u);
}
function leadCopy(btn){
  const el=document.getElementById('lk_url'); el.select();
  try{ navigator.clipboard.writeText(el.value); toast('คัดลอกลิงก์แล้ว'); }
  catch(e){ try{ document.execCommand('copy'); toast('คัดลอกลิงก์แล้ว'); }catch(x){ toast('กดค้างที่ช่องลิงก์เพื่อคัดลอก'); } }
}
async function changePin(){ const o=prompt('PIN เดิม'); if(!o) return; const n=prompt('PIN ใหม่ (ตัวเลข 4–8 หลัก)'); if(!n) return; try{ await call('changePin',{oldPin:o,newPin:n}); toast('เปลี่ยน PIN แล้ว'); }catch(e){ toast(e.message); } }

/* ---------- generic modal ---------- */
function openView(title,html){ document.getElementById('modal').innerHTML=`<h2>${title}<button type="button" onclick="closeModal()" aria-label="ปิด">×</button></h2>${html}`; document.getElementById('overlay').classList.add('open'); }
function openForm(title,fields,data,linked,onSave,onDelete,calc,readonly){
  const html=fields.map(f=>{ const v=data[f.k]??''; let inp; const dis=(readonly||f.dis)?'disabled':'';
    if(f.t==='select') inp=`<select name="${f.k}" ${dis}><option value="">- เลือก -</option>${Object.entries(f.o).map(([k,l])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.t==='multi') inp=`<select name="${f.k}" multiple size="3" ${dis}>${Object.entries(f.o).map(([k,l])=>`<option value="${esc(k)}" ${(v||[]).includes(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.t==='csv') inp=`<input name="${f.k}" value="${esc((v||[]).join(', '))}" ${dis}>`;
    else if(f.t==='textarea') inp=`<textarea name="${f.k}" ${dis}>${esc(v)}</textarea>`;
    else inp=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.t==='number'?'inputmode="decimal" step="any"':''} ${dis}>`;
    return `<div class="f ${f.full?'full':''}"><label>${f.l}</label>${inp}</div>`; }).join('');
  document.getElementById('modal').innerHTML=`<h2>${title}<button type="button" onclick="closeModal()" aria-label="ปิด">×</button></h2><form class="form" id="frm" onsubmit="return false">${html}${calc?'<div class="calc" id="calc"></div>':''}${linked||''}
    <div class="mact">${onDelete?'<button type="button" class="btn danger" id="del">ลบ</button>':'<span></span>'}<span style="display:flex;gap:8px"><button type="button" class="btn" onclick="closeModal()">${readonly?'ปิด':'ยกเลิก'}</button>${readonly?'':'<button type="button" class="btn primary" id="sv">บันทึก</button>'}</span></div></form>`;
  const frm=document.getElementById('frm');
  if(!readonly){
    const sv=document.getElementById('sv');
    // ล็อกปุ่มระหว่างบันทึก กันกดซ้ำแล้วได้รายการซ้ำ (เซิร์ฟเวอร์จะสร้าง id ใหม่ทุกครั้งที่ยังไม่มี id)
    sv.onclick=async()=>{
      if(sv.disabled) return;
      const d={}; fields.forEach(f=>{ const el=frm.elements[f.k]; if(!el) return; if(f.t==='number') d[f.k]=el.value===''?0:Number(el.value); else if(f.t==='multi') d[f.k]=[...el.selectedOptions].map(o=>o.value); else if(f.t==='csv') d[f.k]=el.value.split(/[,、]/).map(s=>s.trim()).filter(Boolean); else d[f.k]=el.value; });
      await act(sv,()=>onSave(d),'กำลังบันทึก…');
    };
  }
  if(onDelete){ const dl=document.getElementById('del'); dl.onclick=()=>act(dl,()=>onDelete(),'กำลังลบ…'); }
  if(calc){ const upd=()=>{const c=document.getElementById('calc'); const out=calc(frm); if(out==='') c.style.display='none'; else c.innerHTML=out;}; frm.addEventListener('input',upd); upd(); }
  document.getElementById('overlay').classList.add('open');
  const first=frm.querySelector('input:not([disabled]),select:not([disabled])'); if(first&&window.innerWidth>860) first.focus();
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(document.getElementById('pinpick')) closePinPicker(); else closeModal(); } });
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3000); }

/* ---------- start ---------- */
// LINE MINI App: อ่านพารามิเตอร์จาก URL เอง ขอข้อมูลเริ่มต้นผ่าน API แล้วเข้าระบบด้วยบัญชี LINE ที่เปิดแอปอยู่ ไม่มีหน้า login
async function miniStart(){
  const box=document.getElementById('authbox');
  box.innerHTML='<h1>กำลังเปิดระบบ…</h1><p>รอสักครู่</p>';
  const read=()=>{ const q=new URLSearchParams(location.search); BOOT.form=q.get('form')||''; BOOT.src=q.get('src')||''; BOOT.view=q.get('v')||''; BOOT.intent=q.get('intent')||''; BOOT.pid=BOOT.form?'':(q.get('p')||''); return q; };
  let q=read();
  const hasLiff=!!(BOOT.liffId&&window.liff);
  // ลิงก์ liff.line.me ส่งพารามิเตอร์มาใน liff.state ต้อง init ก่อนจึงจะได้ URL จริง · หน้าทรัพย์สาธารณะที่เปิดตรงๆ ไม่ต้องรอ LINE
  if(hasLiff&&!(BOOT.form==='lead'&&!q.get('liff.state'))){
    try{ await liff.init({liffId:BOOT.liffId}); BOOT.liffReady=true; q=read(); }catch(e){ BOOT.liffReady=false; }
  }
  if(BOOT.form==='lead'){
    try{ const b=await call('miniBoot',{form:'lead',p:q.get('p')||'',intent:BOOT.intent}); BOOT.lead=b.lead; BOOT.intent=b.intent; BOOT.version=b.version; }catch(e){ BOOT.lead={property:null}; }
    return showLeadForm();
  }
  call('miniBoot',{}).then(b=>{ BOOT.version=b.version; },()=>{});
  // มี token เดิมในเครื่องก็ใช้ก่อน ไม่ออก token ใหม่ทุกครั้งที่เปิด (เซิร์ฟเวอร์เก็บได้ 5 เซสชันต่อคน)
  if(TOKEN){ try{ D=await call('bootstrap'); ME=D.me; return enterUI(); }catch(e){ TOKEN=''; try{localStorage.removeItem('pm_token');}catch(x){} } }
  if(BOOT.liffReady&&liff.isLoggedIn()){
    try{
      const r=await call('liffLogin',{idToken:liff.getIDToken()});
      if(r.pending) return showPending(r.pending);
      TOKEN=r.token; try{localStorage.setItem('pm_token',TOKEN);}catch(e){}
      return enter();
    }catch(e){
      // id token หมดอายุ (เปิดแอปค้างไว้นาน) → ให้ LINE ออกใหม่ ครั้งเดียวพอ กันวนไม่จบ
      let again=false; try{ again=!sessionStorage.getItem('pm_relogin'); sessionStorage.setItem('pm_relogin','1'); }catch(x){}
      if(again&&/หมดอายุ|expired/i.test(e.message)&&!liff.isInClient()){ liff.logout(); return liff.login({redirectUri:location.href}); }
      showAuth('login'); return toast(e.message);
    }
  }
  showAuth('login');
}
// ปุ่ม LINE บนหน้าเข้าสู่ระบบของ MINI App: ในแอป LINE ล็อกอินอยู่แล้ว แค่เข้าใหม่ · เบราว์เซอร์ทั่วไปต้องพาไปหน้า LINE
function miniLogin(){ try{sessionStorage.removeItem('pm_relogin');}catch(e){} if(liff.isLoggedIn()) miniStart(); else liff.login({redirectUri:location.href}); }
(function start(){
  if(BOOT.mini) return miniStart();
  if(BOOT.form==='lead') return showLeadForm();   // หน้าสาธารณะ ไม่ต้องล็อกอิน ไม่ต้อง SSO
  // กลับมาจาก LINE: ลบ ?code=&state= ออกจากแถบที่อยู่ กันรีเฟรช/ย้อนกลับแล้วส่งรหัสที่ใช้ไปแล้วซ้ำ
  if(BOOT.fromCallback){ try{ google.script.history.replace(null,{}); }catch(e){} }
  // การตรวจ state ทำที่เซิร์ฟเวอร์แล้ว token ที่ได้มาจึงใช้ได้เลย ไม่ต้องเทียบกับค่าในเครื่อง
  if(BOOT.token){ TOKEN=BOOT.token; try{localStorage.setItem('pm_token',TOKEN);}catch(e){} }
  if(BOOT.pending){ showPending(BOOT.pending); if(BOOT.authMsg) toast(BOOT.authMsg); return; }
  if(TOKEN){
    enter();
    // ยังล็อกอินค้างอยู่ในเครื่องนี้ ไม่ต้องโชว์ error ของการกดซ้ำ ให้โชว์เฉพาะข้อความสำเร็จ เช่น เชื่อมต่อ LINE เรียบร้อย
    if(BOOT.authMsg&&BOOT.authOk!==false) setTimeout(()=>toast(BOOT.authMsg),300);
    return;
  }
  showAuth('login');
  if(BOOT.authMsg) setTimeout(()=>toast(BOOT.authMsg),300);
})();
</script>
